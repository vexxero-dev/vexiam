[project]
name = "vex-iam"
version = "0.1.0"
description = "Vexxero Identity & Access Management Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.1",
    "pyjwt[crypto]>=2.9.0",
    "redis>=5.1.0",
    "python-multipart>=0.0.12",
    "resend>=2.0.0",
    "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
